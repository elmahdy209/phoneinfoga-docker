services:
  # ------------------------------
  # 1. PhoneInfoga service
  # ------------------------------
  phoneinfoga:
    image: sundowndev/phoneinfoga:latest
    container_name: phoneinfoga
    restart: unless-stopped
    # Launch the web server on port 8080
    command: ["serve", "-p", "8080"]
    expose:
      - "8080"
    environment:
      - PHONEINFOGA_API_MODE=true           # Enable API Mode
      - PHONEINFOGA_API_KEY=XKcd!73abC9z    # Set your API key
      - OVH_APP_KEY=2fa639fc31848947
      - OVH_APP_SECRET=9a07e58b333f1d6a8711668dd5a93e94
      - OVH_CONSUMER_KEY=819abbaa5ce32ee4599eaab244c8ed59
    volumes:
      - data:/root/.phoneinfoga             # Persist cache & settings

    # Healthcheck to ensure service readiness
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      retries: 5
      timeout: 5s

  # ------------------------------
  # 2. Nginx reverse proxy with Basic Auth
  # ------------------------------
  proxy:
    image: nginx:stable-alpine
    container_name: phoneinfoga_proxy
    restart: unless-stopped
    ports:
      - "8080:80"                          # Host:8080 → Container:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro  # Nginx config
      - ./htpasswd:/etc/nginx/.htpasswd:ro              # Auth file
    depends_on:
      phoneinfoga:
        condition: service_healthy

volumes:
  data:
